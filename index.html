<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدّي بطاقات التسامح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2d3d; --navy2:#17445a; --gold:#f2c230; --gold2:#d9a514; --cream:#fbf6ea; --paper:#fffdf7;
  --red:#8a1c1c; --green:#1f8a4c; --wrong:#c0392b; --ink:#1b2730; --muted:#5d6b73;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#fff7dc 0,#f6ecd2 45%,#ecdfbd 100%);color:var(--ink);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.app{min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--navy);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.brand{font-weight:900;font-size:clamp(16px,1.6vw,24px);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .dove{color:var(--gold)}
.round-tag{background:var(--gold);color:var(--navy);font-weight:800;padding:3px 14px;border-radius:30px;font-size:clamp(13px,1.1vw,17px);white-space:nowrap}
.spacer{flex:1}
.tbtn{background:rgba(255,255,255,.12);color:#fff;padding:6px 12px;border-radius:10px;font-size:14px;font-weight:700}
.tbtn:hover{background:rgba(255,255,255,.22)}

/* scoreboard */
.scores{display:flex;gap:10px;padding:10px 18px;flex-wrap:wrap;justify-content:center}
.team{background:var(--paper);border:3px solid transparent;border-radius:16px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:.3s;min-width:150px;position:relative}
.team .dot{width:14px;height:14px;border-radius:50%;flex:none}
.team .nm{font-weight:800;font-size:clamp(14px,1.25vw,19px)}
.team .sc{font-weight:900;font-size:clamp(22px,2.2vw,34px);color:var(--navy);min-width:40px;text-align:center}
.team .adj{display:flex;flex-direction:column;gap:2px}
.team .adj button{width:24px;height:20px;border-radius:6px;background:#eee4cc;color:var(--navy);font-weight:900;font-size:14px;line-height:1}
.team.active{border-color:var(--gold);transform:translateY(-3px) scale(1.04);box-shadow:0 8px 22px rgba(242,194,48,.45)}
.team.active::after{content:"دوركم!";position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-size:12px;font-weight:900;padding:0 10px;border-radius:20px}
.team.bump .sc{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.6);color:var(--green)}}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 18px 24px}

/* generic panels */
.panel{background:var(--paper);border-radius:26px;box-shadow:0 10px 40px rgba(15,45,61,.18);padding:clamp(18px,3vw,40px);max-width:1150px;width:100%;border:3px solid var(--gold)}
h1.big{font-size:clamp(30px,4.4vw,64px);font-weight:900;color:var(--navy);text-align:center;line-height:1.3}
.sub{text-align:center;color:var(--muted);font-size:clamp(16px,1.6vw,24px);margin-top:6px}
.btn{background:var(--navy);color:#fff;font-weight:800;font-size:clamp(18px,1.8vw,26px);padding:12px 34px;border-radius:16px;box-shadow:0 5px 0 #071820;transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #071820}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 5px 0 var(--gold2)}
.btn.green{background:var(--green);box-shadow:0 5px 0 #11603a}
.btn.ghost{background:#efe5cb;color:var(--navy);box-shadow:0 5px 0 #d4c49c}
.btn.sm{font-size:clamp(15px,1.3vw,19px);padding:9px 20px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center}
.mt{margin-top:22px}

/* setup */
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px}
.setup-grid h3{color:var(--navy);font-size:20px;margin-bottom:10px}
.team-input{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.team-input input{flex:1;font-family:inherit;font-size:18px;padding:8px 12px;border-radius:10px;border:2px solid #e2d4ad;background:#fff}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:17px;font-weight:600}
.opt select{font-family:inherit;font-size:17px;padding:6px 10px;border-radius:10px;border:2px solid #e2d4ad;background:#fff}
.rounds-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.rp{background:var(--cream);border-radius:16px;padding:14px;text-align:center;border:2px dashed #e0cd98}
.rp .ic{font-size:34px}
.rp b{display:block;color:var(--navy);font-size:18px}
.rp span{color:var(--muted);font-size:14px}

/* the card */
.card{background:var(--cream);border:5px solid var(--navy);outline:3px solid var(--gold);outline-offset:-12px;border-radius:24px;padding:22px 28px 26px;position:relative;text-align:center;max-width:820px;margin:0 auto;width:100%}
.card .hdr{display:inline-block;background:var(--navy);color:#fff;font-weight:900;font-size:clamp(16px,1.5vw,22px);padding:2px 40px;border-radius:0 0 14px 14px;margin-top:-22px;margin-bottom:10px}
.card .art{font-size:clamp(34px,3.5vw,54px);line-height:1;margin-bottom:4px}
.card .start{font-size:clamp(30px,3.6vw,56px);font-weight:900;color:var(--navy);line-height:1.35}
.card .end{display:inline-block;background:var(--gold);color:var(--red);font-weight:800;font-size:clamp(22px,2.5vw,38px);padding:8px 28px;border-radius:18px;margin-top:12px;line-height:1.4}
.card .end.hidden{background:#efe5cb;color:#b6a77c;letter-spacing:6px}
.card .q{margin-top:20px;border:3px solid var(--gold2);border-radius:18px;background:#fff;padding:22px 18px 14px;position:relative}
.card .q::before{content:"سؤال للنقاش";position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:800;padding:1px 22px;border-radius:10px;font-size:clamp(14px,1.2vw,18px);white-space:nowrap}
.card .q p{font-weight:800;font-size:clamp(20px,2.2vw,32px);color:var(--ink);line-height:1.5}
.card .num{position:absolute;bottom:8px;left:20px;color:var(--muted);font-size:13px;font-weight:700}

/* options */
.options{display:grid;gap:14px;margin-top:22px;max-width:980px;margin-inline:auto}
.option{background:#fff;border:3px solid #e6d8b0;border-radius:18px;padding:14px 22px;font-size:clamp(20px,2.2vw,32px);font-weight:800;color:var(--navy);display:flex;align-items:center;gap:16px;text-align:right;transition:.2s}
.option .lt{flex:none;width:clamp(40px,3.5vw,54px);height:clamp(40px,3.5vw,54px);border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:900}
.option:hover:not(:disabled){border-color:var(--gold);transform:translateX(-4px)}
.option.right{background:#e3f6ea;border-color:var(--green);color:var(--green)}
.option.right .lt{background:var(--green);color:#fff}
.option.bad{background:#fbe6e3;border-color:var(--wrong);color:var(--wrong)}
.option.bad .lt{background:var(--wrong);color:#fff}
.option:disabled{cursor:default}
.option.dim{opacity:.45}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;max-width:1000px;margin-inline:auto}
.cat{background:#fff;border:3px solid #e6d8b0;border-radius:20px;padding:16px;font-size:clamp(19px,2vw,30px);font-weight:800;color:var(--navy);display:flex;align-items:center;gap:14px;justify-content:center;transition:.2s}
.cat .e{font-size:clamp(30px,3vw,46px)}
.cat:hover:not(:disabled){border-color:var(--gold);transform:scale(1.03)}
.cat.right{background:#e3f6ea;border-color:var(--green);color:var(--green)}
.cat.bad{background:#fbe6e3;border-color:var(--wrong);color:var(--wrong)}
.cat:disabled{cursor:default}

.who{text-align:center;font-size:clamp(20px,2vw,30px);font-weight:800;color:var(--navy);margin-bottom:14px}
.who .tm{padding:2px 16px;border-radius:12px;color:#fff}
.feedback{text-align:center;font-size:clamp(24px,2.6vw,40px);font-weight:900;margin-top:16px;min-height:1em}
.feedback.ok{color:var(--green)} .feedback.no{color:var(--wrong)}
.hint{text-align:center;color:var(--muted);font-size:clamp(15px,1.3vw,19px);margin-top:8px}

/* timer */
.timer{height:12px;background:#eadfc2;border-radius:10px;overflow:hidden;margin:0 auto 16px;max-width:820px;position:relative}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--wrong),var(--gold),var(--green));transform-origin:right;transition:transform 1s linear}
.timer-txt{text-align:center;font-weight:900;color:var(--navy);font-size:20px;margin-top:-10px;margin-bottom:6px}

/* wheel */
.wheel-wrap{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.wheel-box{position:relative;width:min(58vh,480px);height:min(58vh,480px)}
.wheel-box canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 10px 40px rgba(15,45,61,.35);transition:transform 5s cubic-bezier(.12,.75,.15,1)}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid var(--wrong);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:var(--navy);border:6px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:clamp(26px,3vw,44px);z-index:2}
.award{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:30px}
.pod{width:clamp(110px,14vw,190px);text-align:center}
.pod .bar{border-radius:16px 16px 0 0;color:#fff;font-weight:900;font-size:clamp(28px,3vw,46px);display:grid;place-items:center}
.pod .pn{font-weight:900;font-size:clamp(16px,1.6vw,24px);color:var(--navy);margin-bottom:6px}
.pod .ps{font-weight:800;color:var(--muted)}
.closing{margin-top:26px;text-align:center;background:var(--gold);color:var(--red);font-weight:900;font-size:clamp(20px,2.3vw,34px);padding:12px 24px;border-radius:18px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.lbl{display:inline-block;margin-top:6px;background:var(--navy);color:var(--gold);font-weight:800;font-size:clamp(14px,1.3vw,19px);padding:2px 14px;border-radius:20px}
.card .lbl+.end,.card .lbl+.q{margin-top:10px}
.explain .start+.lbl{display:table;margin:6px auto 0}
.explain .end+.lbl{display:table;margin:6px auto 0}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

@media (max-width:760px){
  .setup-grid,.cats,.rounds-preview{grid-template-columns:1fr}
  .team{min-width:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dove">🕊️</span> تحدّي بطاقات التسامح</div>
    <div class="round-tag" id="roundTag" style="display:none"></div>
    <div class="spacer"></div>
    <button class="tbtn" id="soundBtn" onclick="toggleSound()">🔊 الصوت</button>
    <button class="tbtn" onclick="goFull()">⛶ ملء الشاشة</button>
    <button class="tbtn" onclick="confirmRestart()">↺ من البداية</button>
  </div>
  <div class="scores" id="scores" style="display:none"></div>
  <div class="stage" id="stage"></div>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ===== بيانات البطاقات (من ملف بطاقات التسامح) ===== */
// [بداية, نهاية, سؤال النقاش, التصنيف]
// التصنيفات: a = الاعتذار وإصلاح الخطأ، r = احترام الاختلاف والإنصات، d = حماية الكرامة ووضع الحدود، c = ضبط الغضب وبداية جديدة
const CARDS = [
["سامحتُ...","لكنني لم أنسَ ما حدث.","هل يمكن أن أسامح وأضع حدودًا تحميني؟","d"],
["كلمةٌ جارحة...","قد يخفّ أثرها باعتذار صادق.","كيف تعتذر لزميل جرحته بكلامك؟","a"],
["التسامح قوة...","وليس علامة ضعف.","متى احتجت إلى الشجاعة كي تسامح؟","c"],
["لا أبرّر الأذى...","لكنني أختار ألّا أحمل الغضب.","ما الذي يساعدك على تهدئة غضبك؟","c"],
["اختلفنا في الرأي...","لكن احترامنا بقي حاضرًا.","كيف تحترم زميلًا يفكر بطريقة مختلفة؟","r"],
["أخطأ صديقي...","فهل أعطيه فرصة لإصلاح الخطأ؟","ما الذي تحتاجه لتمنح فرصة ثانية؟","a"],
["سخر مني زميل...","وأنا أستحق أن أحمي كرامتي.","ممن تطلب الدعم إذا تكررت السخرية؟","d"],
["الاعتذار بداية...","والتغيير الحقيقي يظهر في الأفعال.","كيف تعرف أن الاعتذار صادق؟","a"],
["ليس كل خلاف...","سببًا لإنهاء الصداقة.","ما الخطوة الأولى لإصلاح خلاف بين صديقين؟","r"],
["أستمع قبل أن أحكم...","فقد تكون هناك قصة لا أعرفها.","كيف تتأكد من الحقيقة قبل لوم زميلك؟","r"],
["أسامح نفسي...","وأتعلّم من خطئي بدل أن أكرّره.","ما الذي تقوله لنفسك بعد أن تخطئ؟","c"],
["في صفّنا مكان...","للاختلاف والاحترام والتسامح.","ما اتفاق الصف الذي يساعدنا على التسامح؟","r"],
["اتُّهِمتُ ظلمًا...","واخترتُ أن أشرح موقفي بهدوء.","كيف تتصرف إذا اتهمك زميل بشيء لم تفعله؟","c"],
["أخذ زميلي دوري...","فعبّرتُ عن انزعاجي باحترام.","كيف تطلب حقك دون أن تؤذي الآخر؟","d"],
["نشر أحدهم إشاعة...","فرفضتُ أن أزيدها انتشارًا.","ماذا تفعل إذا سمعت إشاعة عن أحد زملائك؟","r"],
["خسر فريقنا المباراة...","لكن الاحترام لم يخسر معنا.","كيف تتعامل مع الفريق الآخر بعد الخسارة؟","c"],
["قاطعني زميلي...","فطلبتُ منه أن يستمع حتى أنتهي.","ما الطريقة المناسبة لحل خلاف أثناء النقاش؟","r"],
["اعتذرتُ عن خطئي...","وسأثبتُ تغيّري بأفعالي.","ما الفعل الذي يثبت صدق اعتذارك؟","a"],
["لم يدعوني للّعب...","لكنني سأعبّر عن شعوري دون إساءة.","كيف تخبر زملاءك أنك شعرت بالاستبعاد؟","d"],
["سخر أحدهم من إجابتي...","فاخترتُ أن أطلب الدعم وأحمي نفسي.","إلى من تلجأ إذا تكررت السخرية في الصف؟","d"],
["تجادلنا في مشروع الصف...","ثم بحثنا عن حلّ يُرضي الجميع.","كيف تصل إلى حلّ عادل عند اختلاف الآراء؟","r"],
["أخطأتُ بحق صديقي...","فبدأتُ بالاعتراف والاعتذار.","ما الذي يمكن أن تفعله لإصلاح ما أفسدته؟","a"],
["اختلفنا في الرأي...","لكننا بقينا زميلين نحترم بعضنا.","كيف تحترم زميلك عندما يخالفك الرأي؟","r"],
["تلقّيتُ رسالة جارحة...","فلم أُقابل الإساءة بإساءة.","ماذا تفعل قبل الرد على رسالة تُغضبك؟","c"],
["كسر زميلي قلمي...","فطلبتُ منه إصلاح ما حدث.","كيف تجمع بين التسامح وحفظ حقك؟","d"],
["رفض صديقي اعتذاري...","فاحترمتُ حاجته إلى الوقت.","لماذا يحتاج بعض الناس وقتًا لقبول الاعتذار؟","a"],
["ضحكنا على خطأ زميل...","ثم أدركنا أن كلماتنا تؤلمه.","كيف نصلح أثر السخرية بعد وقوعها؟","a"],
["لم يُختر اسمي للفريق...","فاحترمتُ القرار وتحدثتُ عن شعوري.","كيف تُعبّر عن خيبة أملك دون خصام؟","c"],
["اعتذر زميلي أمام الصف...","فقدّرتُ شجاعته في الاعتراف.","ما الذي يجعل الاعتذار شجاعًا وليس ضعفًا؟","a"],
["تكرر الخطأ معي...","فوضعتُ حدودًا واضحة وآمنة.","متى تحتاج إلى طلب مساعدة شخص بالغ؟","d"],
["سمعتُ طرفًا واحدًا...","فاخترتُ ألّا أحكم قبل أن أفهم.","كيف تستمع إلى طرفَي الخلاف بعدل؟","r"],
["عدنا بعد الخصام...","واتفقنا على بداية مختلفة.","ما الاتفاق الذي يمنع تكرار الخلاف؟","c"],
["الاختلاف في الرأي لا يُفسد احترامنا...","لبعضنا.","اختلفتَ مع زميلك أمام الصف؛ كيف تعبّر عن رأيك دون أن تجرحه؟","r"],
["اعتذاري الصادق يصلح ما أفسدته...","كلماتي.","قلتَ كلمة جارحة لصديقك؛ ماذا يمكنك أن تقول لتصلح الموقف؟","a"],
["حين أُستبعد أعبّر عن مشاعري...","دون أن أؤذي.","لم يدعُك زملاؤك إلى اللعب؛ كيف تتحدث معهم بهدوء؟","d"],
["ليس كل خلاف نهايةً للصداقة...","قد يكون بداية فهم.","اختلفتَ مع صديقك في مشروع جماعي؛ كيف تستعيدان التعاون؟","r"],
["أتسامح مع الخطأ، وأضع حدودًا...","تحميني.","كرر زميلك المزاح الذي يزعجك؛ كيف توضّح حدودك باحترام؟","d"],
["أسمع الحقيقة قبل أن أحكم...","على الآخرين.","نقل أحدهم كلامًا عن زميلك؛ ما الذي تفعله قبل تصديقه؟","r"],
["التسامح شجاعة تمنحنا فرصةً...","لبداية جديدة.","عاد زميل بعد خلاف وطلب البدء من جديد؛ ماذا تحتاج لتتوافق؟","c"],
["لا أردّ الإهانة بإهانة؛ أختار...","ردًّا مسؤولًا.","سخر منك طالب أمام زملائك؛ ما الرد الذي يحفظ كرامتك؟","d"],
["نتصالح حين نُصغي لبعضنا...","باحترام.","خلال نقاش صفي ارتفعت الأصوات؛ ما أول خطوة تعيد الحوار الهادئ؟","r"],
["أُصلح ما أستطيع ولا أحمّل نفسي...","أخطاء الجميع.","تحملتَ اللوم في خلاف بين أصدقائك؛ كيف توضّح مسؤوليتك الحقيقية؟","a"],

/* ===== الحالة ===== */
let S = null;
let sound = true;
const stage = document.getElementById('stage');

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(t){return t.replace(/[ً-ْـ.،؛,\s]/g,'')}
function esc(t){return String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

/* ===== الصوت ===== */
let actx=null;
function beep(type){
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seqs = {ok:[[523,.12],[659,.12],[784,.22]], no:[[300,.18],[220,.3]], tick:[[880,.04]], win:[[523,.15],[659,.15],[784,.15],[1047,.4]]};
    let t=actx.currentTime;
    (seqs[type]||[]).forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type= type==='no'?'sawtooth':'triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d); t+=d*.9;
    });
  }catch(e){}
}
function toggleSound(){sound=!sound;document.getElementById('soundBtn').textContent=sound?'🔊 الصوت':'🔇 الصوت'}
function goFull(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}

/* ===== لوحة النقاط ===== */
function renderScores(){
  const el=document.getElementById('scores');
  if(!S){el.style.display='none';return}
  el.style.display='flex';
  el.innerHTML=S.teams.map((t,i)=>`
    <div class="team ${S.showTurn&&i===S.turn?'active':''}" id="team${i}">
      <span class="dot" style="background:${t.color}"></span>
      <span class="nm">${esc(t.name)}</span>
      <span class="sc">${t.score}</span>
      <span class="adj"><button onclick="adjust(${i},1)" title="أضف نقطة">+</button><button onclick="adjust(${i},-1)" title="أنقص نقطة">−</button></span>
    </div>`).join('');
}
function adjust(i,d){S.teams[i].score=Math.max(0,S.teams[i].score+d);renderScores();if(d>0)bump(i)}
function addPoints(i,p){S.teams[i].score+=p;renderScores();bump(i)}
function bump(i){const e=document.getElementById('team'+i);if(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}
function teamTag(i){const t=S.teams[i];return `<span class="tm" style="background:${t.color}">${esc(t.name)}</span>`}
function nextTurn(){S.turn=(S.turn+1)%S.teams.length}
function setRoundTag(txt){const r=document.getElementById('roundTag');if(txt){r.style.display='';r.textContent=txt}else r.style.display='none'}

/* ===== شاشة الإعداد ===== */
function renderSetup(){
  S=null; renderScores(); setRoundTag('');
  stage.innerHTML=`
  <div class="panel fade">
    <h1 class="big">🕊️ تحدّي بطاقات التسامح</h1>
    <p class="sub">لعبة صفية بثلاث جولات للفرق، تُعرض على جهاز العرض</p>
    <div class="setup-grid">
      <div>
        <h3>الفرق</h3>
        <div class="opt">عدد الفرق
          <select id="nTeams" onchange="drawTeamInputs()">
            ${[2,3,4,5,6].map(n=>`<option ${n===5?'selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <div id="teamInputs"></div>
      </div>
      <div>
        <h3>إعدادات الجولات</h3>
        <div class="opt">بطاقات جولة «أكمِل الموقف»
          <select id="n1">${[5,10,15].map(n=>`<option ${n===10?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="opt">بطاقات جولة «صنّف الموقف»
          <select id="n2">${[5,10,15].map(n=>`<option ${n===10?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="opt">دورات «عجلة التسامح»
          <select id="n3">${[5,10].map(n=>`<option ${n===5?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="opt">مؤقّت لكل سؤال

        <div class="opt">جولة تعارف على البطاقات في البداية
          <select id="warm"><option value="1" selected>نعم</option><option value="0">لا</option></select></div>
        <p class="hint" style="text-align:right">💡 مع 25 طالبًا: 5 فرق × 5 طلاب، وتأخذ اللعبة حوالي 35 دقيقة.</p>
      </div>
    </div>
    <div class="rounds-preview">
      <div class="rp"><div class="ic">🧩</div><b>الجولة 1: أكمِل الموقف</b><span>اختاروا الردّ المتسامح من بين 3 ردود (2 نقطة)</span></div>
      <div class="rp"><div class="ic">🗂️</div><b>الجولة 2: صنّف الموقف</b><span>إلى أي قيمة ينتمي الموقف؟ (2 نقطة)</span></div>
      <div class="rp"><div class="ic">🎡</div><b>الجولة 3: عجلة التسامح</b><span>نقاش مفتوح، والمعلم يمنح حتى 3 نقاط</span></div>
    </div>
    <div class="row mt"><button class="btn gold" onclick="startGame()">ابدأ اللعبة ▶</button></div>
  </div>`;
  drawTeamInputs();
}
function drawTeamInputs(){
  const n=+document.getElementById('nTeams').value;
  const box=document.getElementById('teamInputs');
  const old=[...box.querySelectorAll('input')].map(i=>i.value);
  box.innerHTML=Array.from({length:n},(_,i)=>`
    <div class="team-input"><span class="dot" style="width:18px;height:18px;border-radius:50%;background:${TEAM_COLORS[i]}"></span>
    <input value="${esc(old[i]||DEFAULT_NAMES[i])}" maxlength="20"></div>`).join('');
}
function startGame(){
  const names=[...document.querySelectorAll('#teamInputs input')].map((x,i)=>x.value.trim()||DEFAULT_NAMES[i]);
  S={
    teams:names.map((n,i)=>({name:n,score:0,color:TEAM_COLORS[i]})),
    turn:0, showTurn:true,
    n1:+document.getElementById('n1').value, n2:+document.getElementById('n2').value, n3:+document.getElementById('n3').value,
    timer:+document.getElementById('tm').value, warm:document.getElementById('warm').value==='1',
    used:new Set()
  };
  roundIntro(S.warm?0:1);
}
function confirmRestart(){
  if(!S){renderSetup();return}
  stage.innerHTML=`<div class="panel fade" style="max-width:640px;text-align:center">
    <h1 class="big" style="font-size:34px">نبدأ من جديد؟</h1><p class="sub">ستُمسح كل النقاط.</p>
    <div class="row mt"><button class="btn" onclick="renderSetup()">نعم، من البداية</button><button class="btn ghost" onclick="resume()">لا، تابع اللعب</button></div></div>`;
  stopTimer();
}
let resumeFn=null;
function resume(){resumeFn&&resumeFn()}

/* ===== مقدمة الجولات ===== */
const ROUNDS={
  0:{t:"قبل أن نبدأ: تعرّفوا على البطاقات",ic:"🃏",d:"كل بطاقة فيها <b>موقف</b> يحدث في الصف، و<b>ردّ متسامح</b> على هذا الموقف، و<b>سؤال للنقاش</b>.<br>سنكتشف معًا بعض البطاقات قبل أن تبدأ المنافسة."},
  1:{t:"الجولة الأولى: أكمِل الموقف",ic:"🧩",d:"تظهر بداية الموقف، وعلى الفريق الذي عليه الدور أن يختار من بين 3 ردود: أيّها الردّ المتسامح؟<br>الإجابة الصحيحة = 2 نقطة، وإجابة جيدة عن سؤال النقاش = نقطة إضافية."},
  2:{t:"الجولة الثانية: صنّف الموقف",ic:"🗂️",d:"تظهر البطاقة كاملة، والفريق يقرّر: إلى أي قيمة ينتمي هذا الموقف؟<br>الإجابة الصحيحة = 2 نقطة. إذا أقنعتم المعلم بسبب اختياركم، يمكنه قبول الإجابة."},
  3:{t:"الجولة الثالثة: عجلة التسامح",ic:"🎡",d:"يدير الفريق العجلة، فتظهر بطاقة وسؤال للنقاش.<br>يمنح المعلم من 1 إلى 3 نقاط حسب جودة الإجابة، ويمكن للصف أن يشارك برأيه."}
};
function roundIntro(n){
  S.round=n; setRoundTag(n===0?'تعارف':ROUNDS[n].t.split(':')[0]); S.showTurn=false; renderScores();
  const r=ROUNDS[n];
  resumeFn=()=>roundIntro(n);
  stage.innerHTML=`<div class="panel fade" style="text-align:center;max-width:900px">
    <div style="font-size:clamp(60px,7vw,100px)">${r.ic}</div>
    <h1 class="big">${r.t}</h1>
    <p class="sub" style="margin-top:14px;line-height:1.8">${r.d}</p>
    <div class="row mt"><button class="btn gold" onclick="beginRound(${n})">يلا نبدأ ▶</button></div></div>`;
}
function beginRound(n){
  S.showTurn=true; S.idx=0;
  if(n===0){S.deck=pickCards(3);playR0()}
  if(n===1){S.deck=pickCards(S.n1);playR1()}
  if(n===2){S.deck=pickBalanced(S.n2);playR2()}
  if(n===3){S.idx=0;playR3()}
}
function available(){return CARDS.filter(c=>!S.used.has(c.id))}
function pickCards(n){const d=shuffle(available()).slice(0,n);d.forEach(c=>S.used.add(c.id));return d}
function pickBalanced(n){
  const av=shuffle(available()); const by={a:[],r:[],d:[],c:[]}; av.forEach(c=>by[c.cat].push(c));
  const out=[]; let k=0; const keys=shuffle(Object.keys(by));
  while(out.length<n && av.length>out.length){const key=keys[k%4];if(by[key].length)out.push(by[key].shift());k++;if(k>400)break}
  out.forEach(c=>S.used.add(c.id)); return shuffle(out);
}

/* ===== مؤقت ===== */
let timerId=null;
function timerHTML(){return S.timer?`<div class="timer"><i id="tbar"></i></div><div class="timer-txt" id="ttxt">${S.timer}</div>`:''}
function startTimer(){
  stopTimer(); if(!S.timer) return;
  let left=S.timer; const bar=document.getElementById('tbar'),txt=document.getElementById('ttxt');
  timerId=setInterval(()=>{
    left--; if(bar)bar.style.transform=`scaleX(${left/S.timer})`; if(txt)txt.textContent=left>0?left:'⏰ انتهى الوقت!';
    if(left<=5&&left>0)beep('tick');
    if(left<=0){stopTimer();beep('no')}
  },1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

/* ===== رسم البطاقة ===== */
function cardHTML(c,{showEnd=true,showQ=false}={}){
  const art = c.id%2? '🌱':'❤️‍🩹';
  return `<div class="card">
    <div class="hdr">التسامح 🕊️</div>
    <div class="art">${art}</div>
    <div class="start">${esc(c.start)}</div>
    ${showEnd?`<div class="end">${esc(c.end)}</div>`:`<div class="end hidden">؟ ؟ ؟</div>`}
    ${showQ?`<div class="q"><p>${esc(c.q)}</p></div>`:''}
    <div class="num">بطاقة ${c.id}</div>
  </div>`;
}

/* ===== جولة التعارف ===== */
function playR0(){
  S.showTurn=false; renderScores(); resumeFn=playR0;
  if(S.idx===0 && !S.explained){return explainCard()}
  if(S.idx>=S.deck.length){S.turn=0;roundIntro(1);return}
  const c=S.deck[S.idx]; S.step=0;
  setRoundTag(`تعارف • بطاقة ${S.idx+1} من ${S.deck.length}`);
  stage.innerHTML=`<div style="width:100%;max-width:1150px" class="fade">
    <div class="who">اقرؤوا الموقف: ماذا كنتم ستفعلون لو حدث معكم؟</div>
    <div id="cardBox">${cardHTML(c,{showEnd:false})}</div>
    <div class="row mt" id="r0btns"><button class="btn gold" onclick="r0Next()">اكشف الردّ المتسامح 👀</button></div>
  </div>`;
}
function r0Next(){
  const c=S.deck[S.idx]; S.step++;
  if(S.step===1){
    document.getElementById('cardBox').innerHTML=cardHTML(c);beep('ok');
    document.getElementById('r0btns').innerHTML=`<button class="btn gold" onclick="r0Next()">اكشف سؤال النقاش 💬</button>`;
  }else if(S.step===2){
    document.getElementById('cardBox').innerHTML=cardHTML(c,{showQ:true});
    document.getElementById('r0btns').innerHTML=`<button class="btn" onclick="S.idx++;playR0()">${S.idx+1<S.deck.length?'البطاقة التالية ◀':'جاهزون للمنافسة! ◀'}</button>`;
  }
}
function explainCard(){
  setRoundTag('تعارف • كيف نقرأ البطاقة؟');
  const c=CARDS[1];
  stage.innerHTML=`<div style="width:100%;max-width:1150px" class="fade">
    <div class="who">كيف نقرأ البطاقة؟</div>
    <div class="explain">
      <div class="card">
        <div class="hdr">التسامح 🕊️</div>
        <div class="art">❤️‍🩹</div>
        <div class="start">${esc(c.start)}</div><div class="lbl">① الموقف</div>
        <div class="end">${esc(c.end)}</div><div class="lbl">② الردّ المتسامح</div>
        <div class="q"><p>${esc(c.q)}</p></div><div class="lbl">③ سؤال نناقشه معًا</div>
      </div>
    </div>
    <div class="row mt"><button class="btn gold" onclick="S.explained=true;playR0()">لنكتشف بطاقات أخرى ◀</button></div>
  </div>`;
}

/* ===== الجولة 1 ===== */
function playR1(){
  if(S.idx>=S.deck.length){roundIntro(2);return}
  const c=S.deck[S.idx];
  if(!c.opts){
    const bads=shuffle(BAD_ENDINGS).slice(0,2);
    c.opts=shuffle([{t:c.end,ok:true},{t:bads[0],ok:false},{t:bads[1],ok:false}]);
  }
  resumeFn=playR1;
  setRoundTag(`الجولة 1 • بطاقة ${S.idx+1} من ${S.deck.length}`); renderScores();
  stage.innerHTML=`<div style="width:100%;max-width:1150px" class="fade">
    <div class="who">الدور على ${teamTag(S.turn)}</div>
    ${timerHTML()}
    ${cardHTML(c,{showEnd:false})}
    <div class="options">${c.opts.map((o,i)=>`<button class="option" data-i="${i}" onclick="answerR1(${i})"><span class="lt">${['أ','ب','ج'][i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div id="after"></div>
  </div>`;
  startTimer();
}
function answerR1(i){
  stopTimer();
  const c=S.deck[S.idx]; const ok=c.opts[i].ok;
  document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(c.opts[j].ok)b.classList.add('right');else if(j===i)b.classList.add('bad','shake');else b.classList.add('dim')});
  const fb=document.getElementById('fb');
  if(ok){fb.className='feedback ok';fb.textContent='✔ أحسنتم! هذا هو الردّ المتسامح +2';addPoints(S.turn,2);beep('ok');confettiBurst(40)}
  else{fb.className='feedback no';fb.textContent='✘ هذا ردّ غير متسامح… لماذا برأيكم؟';beep('no')}
  const t=S.turn;
  document.getElementById('after').innerHTML=`
    <div class="card fade" style="margin-top:18px;padding-top:8px"><div class="q" style="margin-top:22px"><p>${esc(c.q)}</p></div></div>
    <p class="hint">يناقش ${esc(S.teams[t].name)} سؤال النقاش. إجابة جيدة = نقطة إضافية.</p>
    <div class="row mt">
      <button class="btn green sm" id="bonusBtn" onclick="addPoints(${t},1);beep('ok');this.disabled=true;this.textContent='✔ أُضيفت النقطة'">+1 إجابة نقاش جيدة</button>
      <button class="btn sm" onclick="nextTurn();S.idx++;playR1()">البطاقة التالية ◀</button>
    </div>`;
}

/* ===== الجولة 2 ===== */
function playR2(){
  if(S.idx>=S.deck.length){roundIntro(3);return}
  const c=S.deck[S.idx];
  resumeFn=playR2;
  setRoundTag(`الجولة 2 • موقف ${S.idx+1} من ${S.deck.length}`); renderScores();
  stage.innerHTML=`<div style="width:100%;max-width:1150px" class="fade">
    <div class="who">الدور على ${teamTag(S.turn)}: إلى أي قيمة ينتمي هذا الموقف؟</div>
    ${timerHTML()}
    ${cardHTML(c)}
    <div class="cats">${Object.entries(CATS).map(([k,v])=>`<button class="cat" data-k="${k}" onclick="answerR2('${k}')"><span class="e">${v.e}</span>${v.name}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div id="after"></div>
  </div>`;
  startTimer();
}
function answerR2(k){
  stopTimer();
  const c=S.deck[S.idx]; const ok=k===c.cat; const t=S.turn;
  document.querySelectorAll('.cat').forEach(b=>{b.disabled=true;if(b.dataset.k===c.cat)b.classList.add('right');else if(b.dataset.k===k)b.classList.add('bad','shake')});
  const fb=document.getElementById('fb');
  if(ok){fb.className='feedback ok';fb.textContent='✔ تصنيف صحيح! +2';addPoints(t,2);beep('ok');confettiBurst(40)}
  else{fb.className='feedback no';fb.textContent='✘ التصنيف المقترح: '+CATS[c.cat].e+' '+CATS[c.cat].name;beep('no')}
  document.getElementById('after').innerHTML=`
    <p class="hint">${ok?'اسألوا الفريق: كيف عرفتم؟':'بعض المواقف تنتمي لأكثر من قيمة؛ إذا أقنع الفريقُ الصفَّ بسبب اختياره يمكن قبول الإجابة.'}</p>
    <div class="row mt">
      ${ok?'':`<button class="btn green sm" onclick="addPoints(${t},2);beep('ok');this.disabled=true;this.textContent='✔ قُبلت الإجابة'">قبول بعد النقاش +2</button>`}
      <button class="btn sm" onclick="nextTurn();S.idx++;playR2()">الموقف التالي ◀</button>
    </div>`;
}

/* ===== الجولة 3: العجلة ===== */
let wheelRot=0;
function playR3(){
  if(S.idx>=S.n3){finale();return}
  resumeFn=playR3;
  setRoundTag(`الجولة 3 • دورة ${S.idx+1} من ${S.n3}`); renderScores();
  let pool=shuffle(available()); if(pool.length<4){S.used.clear();pool=shuffle(CARDS)}
  S.wheel=pool.slice(0,8);
  stage.innerHTML=`<div style="width:100%;max-width:1150px" class="fade">
    <div class="who">الدور على ${teamTag(S.turn)}: أديروا العجلة!</div>
    <div class="wheel-wrap">
      <div class="wheel-box"><div class="pointer"></div><canvas id="wheel" width="800" height="800"></canvas><div class="hub">🕊️</div></div>
    </div>
    <div class="row mt"><button class="btn gold" id="spinBtn" onclick="spin()">🎡 أدِر العجلة</button></div>
    <div id="after"></div>
  </div>`;
  drawWheel();
  const cv=document.getElementById('wheel'); cv.style.transition='none'; cv.style.transform=`rotate(${wheelRot}deg)`; void cv.offsetWidth; cv.style.transition='';
}
function drawWheel(){
  const cv=document.getElementById('wheel'),x=cv.getContext('2d'),n=S.wheel.length,R=400,seg=2*Math.PI/n;
  const cols=['#0f2d3d','#f2c230','#17445a','#e8b923','#1f5a73','#f5d36b','#234e63','#d9a514'];
  x.clearRect(0,0,800,800);
  S.wheel.forEach((c,i)=>{
    const a0=-Math.PI/2+i*seg;
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R-4,a0,a0+seg);x.closePath();
    x.fillStyle=cols[i%cols.length];x.fill();x.strokeStyle='#fffdf7';x.lineWidth=6;x.stroke();
    x.save();x.translate(R,R);x.rotate(a0+seg/2);
    x.fillStyle=(i%2)?'#0f2d3d':'#fff';x.font='900 46px Cairo, sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText(String(c.id),R*0.68,0);
    x.font='40px sans-serif';x.fillText(i%2?'🌱':'❤️',R*0.45,0);
    x.restore();
  });
  x.beginPath();x.arc(R,R,R-4,0,2*Math.PI);x.lineWidth=14;x.strokeStyle='#f2c230';x.stroke();
}
function spin(){
  const btn=document.getElementById('spinBtn'); btn.disabled=true; btn.style.opacity=.5;
  const n=S.wheel.length, seg=360/n, target=Math.floor(Math.random()*n);
  // نريد أن يقع منتصف القطاع target تحت المؤشر (أعلى العجلة)
  const want=(360 - (target*seg + seg/2) + 360)%360;
  const jitter=(Math.random()-.5)*seg*0.6;
  const cur=((wheelRot%360)+360)%360;
  let delta=(want - cur + 360)%360;
  wheelRot += 360*6 + delta + jitter;
  const cv=document.getElementById('wheel'); cv.style.transform=`rotate(${wheelRot}deg)`;
  let ticks=0; const tk=setInterval(()=>{beep('tick');if(++ticks>18)clearInterval(tk)},230);
  setTimeout(()=>showR3(S.wheel[target]),5200);
}
function showR3(c){
  S.used.add(c.id); beep('ok'); const t=S.turn;
  document.querySelector('.wheel-wrap').style.display='none';
  document.getElementById('spinBtn').parentElement.style.display='none';
  document.getElementById('after').innerHTML=`<div class="fade">
    ${cardHTML(c,{showQ:true})}
    <p class="hint">يجيب ${esc(S.teams[t].name)}، ثم يسأل المعلم الصف: هل تتفقون؟ هل من فكرة أخرى؟</p>
    <div class="award">
      <button class="btn green sm" onclick="award(${t},3,this)">⭐⭐⭐ ممتازة +3</button>
      <button class="btn green sm" onclick="award(${t},2,this)">⭐⭐ جيدة +2</button>
      <button class="btn green sm" onclick="award(${t},1,this)">⭐ محاولة +1</button>
      <button class="btn sm" onclick="nextTurn();S.idx++;playR3()">الدورة التالية ◀</button>
    </div></div>`;
}
function award(t,p,el){addPoints(t,p);beep('ok');if(p===3)confettiBurst(60);document.querySelectorAll('.award .btn.green').forEach(b=>{b.disabled=true;b.style.opacity=.45});el.style.opacity=1;el.textContent='✔ +'+p}

/* ===== النهاية ===== */
function finale(){
  stopTimer(); S.showTurn=false; renderScores(); setRoundTag('النتائج');
  resumeFn=finale;
  const ranked=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const top=ranked[0].score; const winners=ranked.filter(t=>t.score===top);
  const order=[ranked[1],ranked[0],ranked[2]].filter(Boolean);
  const h={0:'190px',1:'130px',2:'90px'};
  stage.innerHTML=`<div class="panel fade" style="text-align:center">
    <div style="font-size:70px">🏆</div>
    <h1 class="big">${winners.length>1?'تعادل! الفائزون: '+winners.map(w=>esc(w.name)).join(' و'):'الفائز: '+esc(winners[0].name)}</h1>
    <div class="podium">${order.map(t=>{const rank=ranked.indexOf(t);return `<div class="pod"><div class="pn">${esc(t.name)}</div><div class="ps">${t.score} نقطة</div><div class="bar" style="height:${h[rank]};background:${t.color}">${rank+1}</div></div>`}).join('')}</div>
    ${ranked.length>3?`<p class="sub" style="margin-top:14px">${ranked.slice(3).map((t,k)=>`${k+4}. ${esc(t.name)} (${t.score})`).join(' • ')}</p>`:''}
    <div class="closing">🕊️ بالتسامح الواعي نبني صفًا أكثر أمانًا وانتماءً</div>
    <p class="sub" style="margin-top:14px">سؤال الختام للصف: ما المبادرة التي يمكن أن ينفذها صفّنا لنشر التسامح والاحترام؟</p>
    <div class="row mt"><button class="btn gold" onclick="renderSetup()">لعبة جديدة ↺</button></div>
  </div>`;
  beep('win'); confettiBurst(160);
}

function confettiBurst(n){
  const box=document.getElementById('confetti'); const cols=['#f2c230','#1f8a4c','#c0392b','#2367b0','#8e44ad','#0f2d3d'];
  for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.8+Math.random()*2)+'s';p.style.animationDelay=Math.random()*.5+'s';box.appendChild(p);setTimeout(()=>p.remove(),4500)}
}

renderSetup();
</script>
